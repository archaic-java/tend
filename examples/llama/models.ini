version = 1

[*]
n-gpu-layers = all
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
spec-type = none
load-on-startup = false
dedup-cache-models = true
; Coding requests can override sampling. Keep repetition penalties disabled.
repeat-penalty = 1.0
presence-penalty = 0.0

[mimo]
hf-repo = bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
hf-file = MiMo-V2.6-Distill-Qwen-9B-Q5_K_M.gguf
; Text-only agent: do not automatically download/load the vision projector.
no-mmproj = false
ctx-size = 131072
chat-template-kwargs = {"enable_thinking":true}

[qwen36]
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF
hf-file = Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf
no-mmproj = true
ctx-size = 65536
chat-template-kwargs = {"enable_thinking":true}
temp = 0.6
top-p = 0.95
