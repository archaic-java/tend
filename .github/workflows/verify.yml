name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: sh scripts/prepare
      - run: javac @cmd/compile
      - run: java @cmd/test
      - run: java @cmd/run --help
      - run: python3 scripts/bootstrap/test-controller
  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tend:test .
      - run: docker run --rm tend:test --help
  incus-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEND_DISPOSABLE_RUNNER: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile test modules
        run: sh scripts/prepare && javac @cmd/compile
      - name: Install pinned Incus and OVN
        run: bash scripts/incus-smoke/install
      - name: Provision disposable OVN network
        run: bash scripts/incus-smoke/prepare
      - name: Cache Caddy and HTTPS probe images
        run: bash scripts/incus-smoke/prepare-ingress
      - name: Cache private Authelia fixture
        run: bash scripts/incus-smoke/prepare-authelia
      - name: Cache pinned Grafana OCI image
        run: bash scripts/incus-smoke/prepare-grafana
      - name: Cache Pi cloud VM and verify KVM availability
        run: bash scripts/incus-smoke/prepare-pi
      - name: Authorize controller HTTPS client
        run: bash scripts/incus-smoke/authenticate
      - name: Build and import the actual Tend OCI controller
        run: bash scripts/incus-smoke/prepare-controller
      - name: Prepare browser passkey probe
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          google-chrome --version >out/incus-smoke/browser-version.txt
          echo '127.0.0.1 auth.garden.internal' | sudo tee -a /etc/hosts >/dev/null
      - name: Verify real Incus reconciliation and OVN connectivity with Minau
        shell: bash
        run: |
          set -o pipefail
          java @cmd/incus-smoke 2>&1 | tee out/incus-smoke/minau.txt
      - name: Capture Incus and OVN diagnostics
        if: always()
        run: bash scripts/incus-smoke/diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incus-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/incus-smoke/
          retention-days: 7
          # Credentials and controller state remain outside the uploaded directory.
      - name: Remove disposable test resources
        if: always()
        run: bash scripts/incus-smoke/cleanup
