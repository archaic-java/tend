name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: sh scripts/prepare
      - run: javac @cmd/compile
      - run: java @cmd/test
      - run: java @cmd/run --help
  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tend:test .
      - run: docker run --rm tend:test --help
